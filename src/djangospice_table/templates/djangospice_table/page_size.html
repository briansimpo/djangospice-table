{% if page_size_options %}
<div class="flex items-center gap-2">
    <label
        for="{{ page_size_id }}"
        class="text-sm text-slate-600"
    >
        Rows
    </label>

    <select
        id="{{ page_size_id }}"
        name="{{ page_size_parameter }}"
        class="select select-sm"
        hx-get="{{ table_url }}"
        hx-target="{{ htmx_target }}"
        hx-swap="outerHTML"
        hx-push-url="true"
        hx-trigger="change"
    >
        {% for size in page_size_options %}
            <option
                value="{{ size }}"
                {% if size == page_size %}selected{% endif %}
            >
                {{ size }}
            </option>
        {% endfor %}
    </select>
</div>
{% endif %}
